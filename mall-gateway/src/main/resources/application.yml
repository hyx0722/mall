spring:
  application:
    name: mall-gateway
  # 网关无数据源；父 pom 全局声明了 mybatis-plus starter（连带 JDBC 自动配置），这里显式排除
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
    gateway:
      # Spring Cloud Gateway 5.x 静态路由前缀为 spring.cloud.gateway.server.webflux.routes（旧 spring.cloud.gateway.routes 已不再识别）
      server:
        webflux:
          routes:
            # 用户服务：/user/** -> mall-service-user 根路径
            - id: mall-user
              uri: lb://mall-service-user
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            # 商品服务
            - id: mall-product
              uri: lb://mall-service-product
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1
            # 订单服务
            - id: mall-order
              uri: lb://mall-service-order
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
            # 库存服务
            - id: mall-inventory
              uri: lb://mall-service-inventory
              predicates:
                - Path=/inventory/**
              filters:
                - StripPrefix=1
            # 支付服务
            - id: mall-payment
              uri: lb://mall-service-payment
              predicates:
                - Path=/pay/**
              filters:
                - StripPrefix=1
  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 9999

# 跨域白名单（见 com.gateway.config.CorsConfig）。
# 开发期前端走 Vite 代理属同源，用不到它；部署 dist 产物到其它域名/端口时才需要，
# 届时用环境变量覆盖为真实前端地址。**不要改成 `*`**（与 allowCredentials 冲突且等于全站开放）。
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# JWT 签名密钥：由环境变量 JWT_SECRET 注入，仓库内不保留任何默认值。
# ⚠️ 这里**故意不写默认值**（`:${JWT_SECRET:}` 而非 `${JWT_SECRET:某个值}`）：
#    一旦留了默认值，JwtUtil 的长度校验就形同虚设，服务会带着一个仓库里人人可见的
#    密钥正常启动——任何人都能离线签出合法 token 并伪装成管理员。
#    留空时 JwtUtil 构造即抛「未配置 JWT 密钥」，把问题挡在启动阶段。
# 必须与 mall-service-user 的取值一致；生成一个：openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
