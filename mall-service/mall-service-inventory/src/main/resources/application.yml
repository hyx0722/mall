spring:
  profiles:
    active: dev
    include: feign
  application:
    name: mall-service-inventory
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        namespace: dev
        username: nacos
        password: nacos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认：让 outbox relay 能知道消息是否真被 broker 接收、是否路由到了队列。
    # correlated 才会把 CorrelationData 回传给 ConfirmCallback（relay 靠它反查 outbox 行）；
    # publisher-returns + template.mandatory 缺一不可——mandatory 是「无法路由时退回」的前提。
    # 全开后 relay 不再乐观置已发送，改由回调推进，见 OutboxServiceImpl。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 9004

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.yaml?group=mall-service-inventory
      - nacos:datasource.yaml?group=mall-service-inventory

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.yaml?group=mall-service-inventory
      - nacos:datasource.yaml?group=mall-service-inventory


---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.yaml?group=mall-service-inventory
      - nacos:datasource.yaml?group=mall-service-inventory

