# 已在 nacos 中配置，本文件仅作本地参考兜底
# 凭据不入库：用户名/密码由 MYSQL_USERNAME / MYSQL_PASSWORD 环境变量注入
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall_service_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
mybatis-plus:
  configuration:
    log-impl:
    map-underscore-to-camel-case: true #开启驼峰命名和下划线命名的自动转换