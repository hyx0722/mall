spring:
  profiles:
    active: dev
    include: feign
  application:
    name: mall-service-user
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        namespace: dev
        username: nacos
        password: nacos
  # 退券消费 order.canceled / order.refunded 用（只消费不发布，故无 outbox）。
  # 与 order/inventory/payment 一样，RabbitMQ 连接来自本地 yml、不由 Nacos 提供。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}




server:
  port: 9001
# JWT 签名密钥：由环境变量 JWT_SECRET 注入，仓库内不保留任何默认值。
# ⚠️ 这里**故意不写默认值**（`:${JWT_SECRET:}` 而非 `${JWT_SECRET:某个值}`）：
#    一旦留了默认值，JwtUtil 的长度校验就形同虚设（默认值 ≥32 字符会直接通过），
#    服务会带着一个仓库里人人可见的密钥正常启动——任何人都能离线签出合法 token
#    并伪装成管理员。留空时 JwtUtil 构造即抛「未配置 JWT 密钥」，挡在启动阶段。
# 必须与 mall-gateway 的取值一致；生成一个：openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:}
# 启动时若库中不存在管理员，则按以下账号自动创建（登录后可改密）
mall:
  admin:
    username: admin
    password: admin123
  log:
    retention-minutes: 1440     # 保留 24 小时，早于此的文件才会被清扫任务删
    cleanup-interval-ms: 600000 # 每 10 分钟扫一轮

# 日志：按服务名**分目录**落到 logs/<服务名>/。路径相对**进程工作目录**——IDE 里跑可能落在模块目录，
# 那时用 LOG_DIR 环境变量指到项目根（例如 E:\...\mall\logs）。
# 滚动与保留由 Logback 负责（它才删得掉已关闭的历史文件），定时任务只做兜底清扫。
logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

