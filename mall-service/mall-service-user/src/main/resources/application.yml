spring:
  profiles:
    active: dev
    include: feign
  application:
    name: mall-service-user
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        namespace: dev
        username: nacos
        password: nacos




server:
  port: 9001
# JWT 签名密钥：由环境变量 JWT_SECRET 注入，仓库内不再保留密钥值。
# 未提供（或短于 32 字符）时启动即失败，见 com.user.util.JwtUtil 的构造校验。
# 必须与 mall-gateway 的取值一致；生成一个：openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET:pfqydNQjrw39d5g0kRUjtEl4kpF+sV2qzMVBsRKO6Cw=}
# 启动时若库中不存在管理员，则按以下账号自动创建（登录后可改密）
mall:
  admin:
    username: admin
    password: admin123

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.yaml?group=mall-service-user
      - nacos:datasource.yaml?group=mall-service-user

