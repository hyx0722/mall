spring:
  profiles:
    active: dev
    include: feign
  application:
    name: mall-service-order
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        namespace: dev
        username: nacos
        password: nacos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认：让 outbox relay 能知道消息是否真被 broker 接收、是否路由到了队列。
    # correlated 才会把 CorrelationData 回传给 ConfirmCallback（relay 靠它反查 outbox 行）；
    # publisher-returns + template.mandatory 缺一不可——mandatory 是「无法路由时退回」的前提。
    # 全开后 relay 不再乐观置已发送，改由回调推进，见 OutboxServiceImpl。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 9003

# 支付超时自动取消阈值（分钟）
order:
  pay-timeout-minutes: 30
  # 平台佣金率：按**行实付**（行原价 − 行分摊优惠）计，不是按原价——
  # 否则平台会从自己让利出去的那部分钱里再抽一份佣金
  commission-rate: 0.05
  # 账期 T+N：结算明细生成后 N 天才转为可提现（售后期内退款的风险由平台先担着）
  settlement-delay-days: 7

# 日志：按服务名**分目录**落到 logs/<服务名>/。路径相对**进程工作目录**——IDE 里跑可能落在模块目录，
# 那时用 LOG_DIR 环境变量指到项目根（例如 E:\...\mall\logs）。
# 滚动与保留由 Logback 负责（它才删得掉已关闭的历史文件），定时任务只做兜底清扫。
logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 100MB
mall:
  log:
    retention-minutes: 1440     # 保留 24 小时，早于此的文件才会被清扫任务删
    cleanup-interval-ms: 600000 # 每 10 分钟扫一轮

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.yaml?group=mall-service-order
      - nacos:datasource.yaml?group=mall-service-order

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.yaml?group=mall-service-order
      - nacos:datasource.yaml?group=mall-service-order


---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.yaml?group=mall-service-order
      - nacos:datasource.yaml?group=mall-service-order

