spring:
  profiles:
    active: dev
    include: feign
  application:
    name: mall-service-payment
  cloud:
    nacos:
      server-addr: localhost:8848
      username: nacos
      password: nacos
      config:
        namespace: dev
        username: nacos
        password: nacos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认：让 outbox relay 能知道消息是否真被 broker 接收、是否路由到了队列。
    # correlated 才会把 CorrelationData 回传给 ConfirmCallback（relay 靠它反查 outbox 行）；
    # publisher-returns + template.mandatory 缺一不可——mandatory 是「无法路由时退回」的前提。
    # 全开后 relay 不再乐观置已发送，改由回调推进，见 OutboxServiceImpl。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 9005

# 支付渠道占位配置（真实微信/支付宝商户参数后替换）。
# 各渠道 enabled=false 时不加载/调用 SDK 运行时代码（仅 classpath 存在供编译）。
payment:
  mock:
    enabled: true           # 测试钩子开关：true 时 POST /pay/mock/success 模拟支付成功，且退款走模拟打款
  alipay:
    enabled: false          # 支付宝渠道
    gateway: https://openapi.alipay.com/gateway.do
    app-id: 2016081100000000              # 占位：真实应用 APPID
    private-key: YOUR_APP_PRIVATE_KEY     # 占位：应用私钥（PKCS8，去除头尾）
    alipay-public-key: YOUR_ALIPAY_PUBLIC_KEY  # 占位：支付宝公钥（验签用）
    notify-url: http://localhost:9999/pay/alipay/notify
  wxpay:
    enabled: false          # 微信支付渠道
    mch-id: "1900000000"                   # 占位：微信支付商户号
    app-id: wx8888888888888888             # 占位：公众号/小程序 AppID
    api-v3-key: YOUR_APIV3_KEY             # 占位：APIv3 密钥
    private-key-path: classpath:apiclient_key.pem   # 占位：商户 API 私钥（apiclient_key.pem）
    merchant-serial-no: YOUR_SERIAL_NO     # 占位：商户证书序列号
    notify-url: http://localhost:9999/pay/wx/notify

# 日志：按服务名**分目录**落到 logs/<服务名>/。路径相对**进程工作目录**——IDE 里跑可能落在模块目录，
# 那时用 LOG_DIR 环境变量指到项目根（例如 E:\...\mall\logs）。
# 滚动与保留由 Logback 负责（它才删得掉已关闭的历史文件），定时任务只做兜底清扫。
logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 3
      total-size-cap: 100MB
mall:
  log:
    retention-minutes: 1440     # 保留 24 小时，早于此的文件才会被清扫任务删
    cleanup-interval-ms: 600000 # 每 10 分钟扫一轮

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
---
spring:
  config:
    activate:
      on-profile: test
    import:
      - nacos:common.yaml?group=mall-service-payment
      - nacos:datasource.yaml?group=mall-service-payment

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - nacos:common.yaml?group=mall-service-payment
      - nacos:datasource.yaml?group=mall-service-payment

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:common.yaml?group=mall-service-payment
      - nacos:datasource.yaml?group=mall-service-payment
