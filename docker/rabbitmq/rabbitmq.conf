# mall 本地开发专用 RabbitMQ 配置（仅由 docker-compose 挂载，不影响其它环境）
#
# 放开 guest 用户的 loopback 限制。
# 原因：业务服务跑在宿主机、经端口映射访问容器，连接源 IP 是 docker 网桥（如 172.x）
#      而不是 127.0.0.1，RabbitMQ 默认会以
#      "guest user can only connect via localhost" 拒绝握手——
#      表现为服务启动时连接被拒，很容易误判成配置写错。
#
# 生产环境请勿使用本配置：应删除此行并改用独立账号
# （通过 RABBITMQ_USERNAME / RABBITMQ_PASSWORD / RABBITMQ_DEFAULT_USER/PASS 注入）。
loopback_users.guest = false
